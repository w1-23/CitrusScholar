      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          python -m pip install -r .github/regression-dependencies.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Run isolated application regressions
