name: Application regressions

on:
  pull_request:
  push:
    branches: [main, codex/8043-ui-core-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

