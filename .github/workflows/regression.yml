  release-contract:
    name: Immutable 8043 release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the candidate Git archive and release fixtures
        run: |
          python -B 04_scripts/stage_8043_release.py archive-check \
            --repository "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA"
          python -B 04_scripts/stage_8043_release_test.py
          python -B 04_scripts/stage_fusion_release_test.py
          python -B 04_scripts/verify_standalone_skill_overlay_test.py
          python -B 04_scripts/cutover_8043_record_test.py
  skills-lock:
    name: Standalone Skill lock drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install staging dependency
        run: python -m pip install pyyaml==6.0.2
      - name: Clone locked Skill repositories
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          lock = json.loads(Path("02_config/standalone-skills.lock.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"]) / "skill-sources"
          for name, entry in lock.items():
              target = root / name
              subprocess.run(["git", "init", "-q", str(target)], check=True)
              subprocess.run(["git", "-C", str(target), "remote", "add", "origin",
                              entry["repository"]], check=True)
              git = ["git", "-C", str(target)]
              overlay = entry.get("source_bundle")
              base = overlay["base_commit"] if overlay else entry["commit"]
              subprocess.run([*git, "fetch", "--depth", "1", "origin", base], check=True)
              if overlay:
                  if overlay["file"] != f"{name}.bundle" or not overlay["ref"].startswith("refs/heads/"):
                      raise ValueError(f"Invalid Skill bundle reference for {name}")
                  bundle = Path("02_config/skill-source-bundles", overlay["file"]).resolve()
                  if hashlib.sha256(bundle.read_bytes()).hexdigest() != overlay["sha256"]:
                      raise ValueError(f"Skill bundle checksum mismatch for {name}")
                  subprocess.run([*git, "bundle", "verify", str(bundle)], check=True)
                  subprocess.run([*git, "fetch", "--no-tags", str(bundle), overlay["ref"]], check=True)
                  if subprocess.check_output([*git, "rev-parse", "FETCH_HEAD^"], text=True).strip() != base:
                      raise ValueError(f"Skill bundle prerequisite mismatch for {name}")
              if subprocess.check_output([*git, "rev-parse", "FETCH_HEAD"], text=True).strip() != entry["commit"]:
                  raise ValueError(f"Skill source pin mismatch for {name}")
              subprocess.run([*git, "checkout", "-q", "FETCH_HEAD"], check=True)
          PY
      - name: Stage locked runtime packages
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python 04_scripts/stage_skill_release.py \
            --repositories "$RUNNER_TEMP/skill-sources" \
            --output "$RUNNER_TEMP/skill-release" \
            --include-runtime
      - name: Verify locked package bytes and the exact host audit overlay
        run: |
          python -B 04_scripts/verify_standalone_skill_overlay.py \
            --staged-python "$RUNNER_TEMP/skill-release/python" --host-packages packages

  node:
    name: Node browser-state fixtures
    runs-on: ubuntu-24.04
