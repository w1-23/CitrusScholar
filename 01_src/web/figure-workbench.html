<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>图件工作台 · CitrusScholar</title>
  <script src="/assets/citrus-theme.js"></script>
  <link rel="stylesheet" href="/assets/workbench/workbench.css?v=2">
  <link rel="stylesheet" href="/assets/citrus-theme.css">
  <script src="/assets/figures/hit_geometry.js?v=1" defer></script>
  <script type="module" src="/assets/workbench/main.js?v=4"></script>
</head>
<body class="figure-workbench">
  <header class="toolbar">
    <div class="workspace-name">
      <a class="brand" href="/" aria-label="CitrusScholar 首页"><span aria-hidden="true">C</span> CitrusScholar</a>
      <h1>图件工作台</h1>
    </div>
    <nav aria-label="工作台操作">
      <button id="openLibrary">打开图件</button>
      <button id="toggleGroups" class="drawer-button" aria-controls="groups" aria-expanded="false">对象组</button>
      <button id="toggleInspector" class="drawer-button" aria-controls="inspector" aria-expanded="false">属性</button>
      <select id="themeChoice" aria-label="界面主题" hidden></select>
      <button id="undo" disabled>撤销</button>
      <button id="redo" disabled>重做</button>
      <button id="save" class="primary" disabled>保存图件</button>
      <details id="exports" class="exports">
        <summary>导出</summary>
        <div class="export-menu" id="exportMenu"></div>
      </details>
    </nav>
  </header>
  <main class="workbench">
    <aside id="groups" class="sidebar" aria-labelledby="groupsTitle">
      <div id="assetShelf">
        <section class="asset-library" id="assetLibrary" aria-labelledby="assetLibraryTitle">
        <h2 id="assetLibraryTitle">图件库</h2>
        <label>按名称筛选<input type="search" id="assetQuery" maxlength="120" placeholder="输入图件名称"></label>
        <p id="assetStatus" role="status"></p>
        <ul id="assetList" aria-label="已有图件"></ul>
        <button id="assetMore" hidden>加载更多图件</button>
        <button id="assetRetry" hidden>重试列表</button>
        </section>
      </div>
      <h2 id="groupsTitle">对象组</h2>
      <p id="groupsEmpty" class="muted">打开图件后选择要编辑的对象组。</p>
      <ul id="groupTree" class="tree" role="tree" aria-labelledby="groupsTitle" hidden></ul>
    </aside>
    <section class="canvas-area" aria-labelledby="figureTitle">
      <div class="canvas-toolbar">
        <div class="figure-name"><h2 id="figureTitle">未打开图件</h2><span id="revision"></span></div>
        <div class="view-controls" aria-label="画布控制">
          <button id="zoomOut" aria-label="缩小" disabled>−</button>
          <button id="fit" aria-label="适合窗口" aria-pressed="true" disabled>适应</button>
          <button id="actualSize" aria-label="实际大小 100%" aria-pressed="false" disabled>100%</button>
          <button id="zoomIn" aria-label="放大" disabled>＋</button>
          <output id="zoomLevel" aria-label="当前缩放"></output>
          <button id="picking" aria-pressed="true" disabled>画布选取</button>
        </div>
      </div>
      <div id="canvas" class="canvas" tabindex="0" aria-label="图件画布">
        <div id="canvasEmpty" class="canvas-empty"><div><svg aria-hidden="true" viewBox="0 0 48 48" fill="none"><rect x="7" y="7" width="34" height="34" rx="7"/><path d="M15 32V22m9 10V16m9 16V25"/></svg><strong>图件画布</strong><span>从图件库打开图件，也可将图件拖到画布。</span></div></div>
        <div id="frame" class="frame" hidden>
          <img id="preview" class="preview" alt="图件预览" draggable="false">
          <div id="outline" class="selection" aria-hidden="true" hidden></div>
        </div>
      </div>
      <p id="canvasStatus" class="canvas-status" aria-live="polite"></p>
    </section>
    <aside id="inspector" class="sidebar inspector" aria-labelledby="inspectorTitle">
      <h2 id="inspectorTitle" tabindex="-1">属性</h2>
      <div id="propertyPanel" class="property-panel"><p class="muted">选择对象组以查看可用属性。</p></div>
    </aside>
  </main>
  <footer id="status" class="status" role="status" aria-live="polite"></footer>
  <dialog id="library" aria-labelledby="libraryTitle">
    <div class="library-body">
      <div class="dialog-heading"><h2 id="libraryTitle">打开已有图件</h2><button id="cancelOpen" aria-label="关闭图件库">关闭</button></div>
      <div id="assetDialogShelf"></div>
      <p id="libraryNotice" class="muted" role="status">选择图件即可打开。</p>
    </div>
  </dialog>
</body>
</html>
